[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentiment"
version = "0.1.0"
description = "Multi-Modal Bitcoin Market Sentiment Engine with Regex Pre-Filtering, TypeSafe Jev Semantic Typing, and JEPA Latent Representation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Quantitative Research Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "typesafe-sdk>=0.1.0",
    "pyarrow>=15.0.0",
    "duckdb>=0.10.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "trafilatura>=1.8.0",
    "websockets>=12.0",
    "orjson>=3.10.0",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]
ml = [
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
